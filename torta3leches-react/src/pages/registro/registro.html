<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - PokéComelones</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../registro/style.css">
</head>
<body>

    <header class="header">
        <div class="logo">
            <img src="../imagenes/Poké Comelones (1) (1).png" alt="Logo PokéComelones">
        </div>
        <div class="header-spacer"></div>
        <nav class="nav">
            <a href="../inicio/PokeComelones.html" class="btn">Inicio</a>
            <a href="../iniciar_sesion/iniciarSesion.html" class="btn">Iniciar Sesión</a>
        </nav>
    </header>

    <main class="login-main">
        <div class="login-container registro-container">
            <h2 class="login-titulo">Registro de Usuario</h2>
            <p class="login-subtitulo">¡Únete a la familia PokéComelones!</p>
            
            <form id="registroForm" novalidate>
                
                <div class="form-group">
                    <label for="run">RUN:</label>
                    <input type="text" id="run" name="run" maxlength="9" placeholder="Ej: 19011022K" required>
                    <small id="runError" class="error-msg"></small>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" name="nombre" maxlength="50" placeholder="Tu nombre" required>
                        <small id="nombreError" class="error-msg"></small>
                    </div>

                    <div class="form-group">
                        <label for="apellidos">Apellidos:</label>
                        <input type="text" id="apellidos" name="apellidos" maxlength="100" placeholder="Tus apellidos" required>
                        <small id="apellidosError" class="error-msg"></small>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" maxlength="100" placeholder="ejemplo@duoc.cl" required>
                    <small id="emailError" class="error-msg"></small>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" placeholder="Entre 4 y 10 caracteres" required>
                    <small id="passwordError" class="error-msg"></small>
                </div>

                <div class="form-group">
                    <label for="fechaNacimiento">Fecha de Nacimiento:</label>
                    <input type="date" id="fechaNacimiento" name="fechaNacimiento">
                    <small id="fechaError" class="error-msg"></small>
                </div>

                <div class="form-group">
                    <label for="tipoUsuario">Tipo de Usuario:</label>
                    <select id="tipoUsuario" name="tipoUsuario" required>
                        <option value="">Selecciona un tipo</option>
                        <option value="administrador">Administrador</option>
                        <option value="vendedor">Vendedor</option>
                        <option value="cliente">Cliente</option>
                    </select>
                    <small id="tipoUsuarioError" class="error-msg"></small>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="region">Región:</label>
                        <select id="region" name="region" required>
                            <option value="">Selecciona una región</option>
                        </select>
                        <small id="regionError" class="error-msg"></small>
                    </div>

                    <div class="form-group">
                        <label for="comuna">Comuna:</label>
                        <select id="comuna" name="comuna" required>
                            <option value="">Selecciona una comuna</option>
                        </select>
                        <small id="comunaError" class="error-msg"></small>
                    </div>
                </div>

                <div class="form-group">
                    <label for="direccion">Dirección:</label>
                    <input type="text" id="direccion" name="direccion" maxlength="300" placeholder="Calle, número, depto..." required>
                    <small id="direccionError" class="error-msg"></small>
                </div>

                <button type="submit" id="submitBtn" class="btn-login" disabled>Registrarme</button>
            </form>
            
            <p class="login-link">
                ¿Ya tienes cuenta? <a href="../iniciar_sesion/iniciarSesion.html">Inicia sesión aquí</a>
            </p>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-contenido">
            <p class="footer-text">&copy; Sitio web de Agatha y Diego. Todos los derechos reservados 2026</p>
            <nav class="footer-btn">
                <a href="#">Contacto</a>
                <a href="#">Nosotros</a>
            </nav>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="registro.js"></script>
</body>
</html>
