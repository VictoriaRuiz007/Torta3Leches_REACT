<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - PokéComelones</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../iniciar_sesion/style.css">
</head>
<body>

    <header class="header">
        <div class="logo">
            <img src="../imagenes/Poké Comelones (1) (1).png" alt="Logo PokéComelones">
        </div>
        <div class="header-spacer"></div>
        <nav class="nav">
            <a href="../inicio/PokeComelones.html" class="btn">Inicio</a>
            <a href="../registro/registro.html" class="btn">Registro</a>
        </nav>
    </header>

    <main class="login-main">
        <div class="login-container">
            <h2 class="login-titulo">Inicio de Sesión</h2>
            <p class="login-subtitulo">¡Bienvenido de vuelta a PokéComelones!</p>
            
            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" maxlength="100" placeholder="ejemplo@duoc.cl" required>
                    <small id="emailError" class="error-msg"></small>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" placeholder="Entre 4 y 10 caracteres" required>
                    <small id="passwordError" class="error-msg"></small>
                </div>

                <button type="submit" id="submitBtn" class="btn-login" disabled>Ingresar</button>
            </form>
            
            <p class="login-link">
                ¿No tienes cuenta? <a href="../registro/registro.html">Regístrate aquí</a>
            </p>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-contenido">
            <p class="footer-text">&copy; Sitio web de Agatha y Diego. Todos los derechos reservados 2026</p>
            <nav class="footer-btn">
                <a href="#">Contacto</a>
                <a href="#">Nosotros</a>
            </nav>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="login.js"></script>
</body>
</html>
