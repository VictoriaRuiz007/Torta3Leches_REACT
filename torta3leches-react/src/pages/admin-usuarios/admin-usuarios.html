<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Usuarios</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin-usuarios.css">
</head>
<body>
    <div class="admin-wrapper">
        <aside class="admin-sidebar">
            <div class="sidebar-brand">
                <img src="../imagenes/Poké Comelones (1) (1).png" alt="Logo" style="height: 50px;">
                <h3>Panel Admin</h3>
            </div>
            <nav class="sidebar-nav">
                <a href="../admin/admin.html"><span class="icon">📊</span> Inicio</a>
                <a href="../admin-productos/admin-productos.html"><span class="icon">🍰</span> Productos</a>
                <a href="admin-usuarios.html" class="active"><span class="icon">👥</span> Usuarios</a>
                <a href="#" id="btnLogout"><span class="icon">🚪</span> Cerrar Sesión</a>
            </nav>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <h1>Gestión de Usuarios</h1>
                <button class="btn-submit" id="btnNuevoUsuario" style="width: auto; padding: 8px 25px;">+ Nuevo Usuario</button>
            </header>

            <div class="admin-table-container">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>RUN</th>
                            <th>Nombre</th>
                            <th>Correo</th>
                            <th>Tipo</th>
                            <th>Región</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaUsuarios">
                    </tbody>
                </table>
            </div>

            <div id="formUsuarioContainer" style="display: none;">
                <h3 id="formUsuarioTitulo">Nuevo Usuario</h3>
                <form id="formUsuario" class="admin-form" novalidate>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="run">RUN (sin puntos ni guion):</label>
                            <input type="text" id="run" placeholder="Ej: 19011022K" maxlength="9" required>
                            <small id="runError" class="error-msg"></small>
                        </div>
                        <div class="form-group">
                            <label for="nombreUsuario">Nombre:</label>
                            <input type="text" id="nombreUsuario" maxlength="50" required>
                            <small id="nombreUsuarioError" class="error-msg"></small>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="apellidos">Apellidos:</label>
                            <input type="text" id="apellidos" maxlength="100" required>
                            <small id="apellidosError" class="error-msg"></small>
                        </div>
                        <div class="form-group">
                            <label for="emailUsuario">Correo:</label>
                            <input type="email" id="emailUsuario" maxlength="100" required>
                            <small id="emailUsuarioError" class="error-msg"></small>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="passwordUsuario">Contraseña (4-10 caracteres):</label>
                            <input type="password" id="passwordUsuario" required>
                            <small id="passwordUsuarioError" class="error-msg"></small>
                        </div>
                        <div class="form-group">
                            <label for="fechaNacimiento">Fecha Nacimiento:</label>
                            <input type="date" id="fechaNacimiento">
                            <small id="fechaError" class="error-msg"></small>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="tipoUsuario">Tipo de Usuario:</label>
                            <select id="tipoUsuario" required>
                                <option value="">Seleccionar</option>
                                <option value="administrador">Administrador</option>
                                <option value="vendedor">Vendedor</option>
                                <option value="cliente">Cliente</option>
                            </select>
                            <small id="tipoUsuarioError" class="error-msg"></small>
                        </div>
                        <div class="form-group">
                            <label for="regionUsuario">Región:</label>
                            <select id="regionUsuario" required>
                                <option value="">Seleccionar</option>
                            </select>
                            <small id="regionUsuarioError" class="error-msg"></small>
                        </div>
                        <div class="form-group">
                            <label for="comunaUsuario">Comuna:</label>
                            <select id="comunaUsuario" required>
                                <option value="">Seleccionar</option>
                            </select>
                            <small id="comunaUsuarioError" class="error-msg"></small>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="direccion">Dirección:</label>
                        <input type="text" id="direccion" maxlength="300" required>
                        <small id="direccionError" class="error-msg"></small>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button type="submit" id="submitUsuarioBtn" class="btn-submit" disabled>Guardar</button>
                        <button type="button" id="cancelarUsuarioBtn" class="btn-submit" style="background-color: #B0BEC5;">Cancelar</button>
                    </div>
                </form>
            </div>

        </main>
    </div>

    <script src="../admin/admin.js"></script>
    <script src="admin-usuarios.js"></script>
</body>
</html>
