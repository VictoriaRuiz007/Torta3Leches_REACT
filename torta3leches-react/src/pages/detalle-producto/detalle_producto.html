<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../inicio/style.css">
    <title>Detalle del Producto - PokéComelones</title>
</head>
<body>

<header class="header">
    <div class="logo">
        <img src="../imagenes/Poké Comelones (1) (1).png" alt="Logo PokéComelones">
    </div>
    <div class="header-spacer"></div>
    <nav class="nav">
        <a href="../inicio/PokeComelones.html" class="btn">Inicio</a>
        <a href="../iniciar_sesion/iniciarSesion.html" class="btn">Iniciar Sesión</a>
        <a href="../registro/registro.html" class="btn">Registro</a>
        <a href="../carrito/carrito.html" class="btn"> Carrito</a>
    </nav>
</header>

<main class="detalle-main">
    <div class="detalle-container">
        
        <div class="detalle-imagen-box">
            <img id="detalle-imagen" src="" alt="Producto">
        </div>

        <div class="detalle-info-box">
            <span id="detalle-categoria" class="badge-categoria">Categoría</span>
            <h1 id="detalle-nombre" class="detalle-titulo">Nombre del Producto</h1>
            <p id="detalle-precio" class="detalle-precio">$0</p>
            
            <p id="detalle-descripcion" class="detalle-desc">
                Descripción del producto...
            </p>

            <div class="detalle-stock-info">
                <span>Stock disponible: <strong id="detalle-stock">0</strong> unidades</span>
            </div>

            <button id="btn-agregar-carrito" class="btn-comprar-grande">
                 Añadir al Carrito
            </button>
            
            <a href="../inicio/PokeComelones.html" class="btn-volver">← Volver a la tienda</a>
        </div>

    </div>
</main>

<footer class="footer">
    <div class="footer-contenido">
        <p class="footer-text">&copy; Sitio web de Agatha y Diego. Todos los derechos reservados 2026</p>
        <nav class="footer-btn">
            <a href="../contacto/contacto.html">Contacto</a>
            <a href="../nosotros/nosotros.html">Nosotros</a>
        </nav>
    </div>
</footer>

<script src="../inicio/productos.js"></script>
<script src="detalle.js"></script>

</body>
</html>
