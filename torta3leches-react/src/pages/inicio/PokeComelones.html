<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../inicio/style.css">
    <title>PokéComelones</title>
</head>
<body>

<header class="header">
    <div class="logo">
        <img src="../imagenes/Poké Comelones (1) (1).png" alt="Logo PokéComelones" class="img-fluid">
    </div>
    <div class="header-spacer"></div>
    <nav class="nav">
        <span id="usuarioSaludo" style="color: #FFF5E1; font-weight: 600; display: none; margin-right: 10px;"></span>

        <a href="../iniciar_sesion/iniciarSesion.html" class="btn" id="btnLogin">Iniciar Sesión</a>   
        <a href="../registro/registro.html" class="btn" id="btnRegistro">Registro</a>
        <a href="../blogs/blogs.html" class="btn" id="btnBlogs">Blogs</a>   <!-- ✅ NUEVO BOTÓN -->
        <a href="../carrito/carrito.html" class="btn">🛒 Carrito</a>

        <a href="../admin/admin.html" class="btn" id="btnAdmin" style="display: none;">🔧 Admin</a>
    </nav>
</header> 
        
<main>
    <div style="text-align: center; margin-bottom: 30px; width: 100%;">
        <h2 style="font-family: 'Pacifico', cursive; color: #8B4513; font-size: 36px;">Nuestros Productos</h2>
        <p style="color: #5D4037; font-family: 'Lato', sans-serif;">Descubre los sabores más dulces de nuestra pastelería</p>
    </div>
    
    <div class="btns-filtros" id="filtro-categorias">
        <button class="btn btn-filtro active" data-categoria="Todos">Todos</button>
        <button class="btn btn-filtro" data-categoria="Tortas Cuadradas">Tortas Cuadradas</button>
        <button class="btn btn-filtro" data-categoria="Tortas Circulares">Tortas Circulares</button>
        <button class="btn btn-filtro" data-categoria="Postres Individuales">Postres Individuales</button>
        <button class="btn btn-filtro" data-categoria="Productos Sin Azúcar">Sin Azúcar</button>
        <button class="btn btn-filtro" data-categoria="Pasteleria Tradicional">Tradicional</button>
        <button class="btn btn-filtro" data-categoria="Productos Sin Glúten">Sin Glúten</button>            
        <button class="btn btn-filtro" data-categoria="Productos Vegano">Veganos</button>
        <button class="btn btn-filtro" data-categoria="Tortas Especiales">Especiales</button>
    </div>

    <section id="recursos-multimedia">
    </section>
</main>

<footer class="footer">
    <div class="footer-contenido">
        <p class="footer-text">&copy; Sitio web de Agatha y Diego. Todos los derechos reservados 2026</p>
        <nav class="footer-btn">
            <a href="../contacto/contacto.html">Contacto</a>
            <a href="../nosotros/nosotros.html">Nosotros</a>
            <a href="../blogs/blogs.html">Blogs</a>   
        </nav>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../inicio/function.js"></script>
<script src="../inicio/productos.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const usuarioLogueado = JSON.parse(localStorage.getItem('usuarioLogueado'));
        const btnAdmin = document.getElementById('btnAdmin');
        const btnLogin = document.getElementById('btnLogin');
        const btnRegistro = document.getElementById('btnRegistro');
        const saludo = document.getElementById('usuarioSaludo');

        if (usuarioLogueado) {
            btnLogin.style.display = 'none';
            btnRegistro.style.display = 'none';

            saludo.style.display = 'inline-block';
            saludo.textContent = `👋 Hola, ${usuarioLogueado.nombre || 'Usuario'}`;

            if (usuarioLogueado.rol === 'administrador') {
                btnAdmin.style.display = 'inline-flex';
            }
        } else {
            btnLogin.style.display = 'inline-flex';
            btnRegistro.style.display = 'inline-flex';
            btnAdmin.style.display = 'none';
            saludo.style.display = 'none';
        }
    });
</script>

</body>
</html>
