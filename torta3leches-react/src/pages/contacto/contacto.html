<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../contacto/style.css">
    <title>Contacto - PokéComelones</title>
</head>
<body>

<header class="header">
    <div class="logo">
        <img src="../imagenes/Poké Comelones (1) (1).png" alt="Logo PokéComelones">
    </div>
    <div class="header-spacer"></div>
    <nav class="nav">
        <a href="../inicio/PokeComelones.html" class="btn">Inicio</a>
        <a href="../iniciar_sesion/iniciarSesion.html" class="btn">Iniciar Sesión</a>
        <a href="../registro/registro.html" class="btn">Registro</a>
        <a href="../carrito/carrito.html" class="btn">🛒 Carrito</a>
    </nav>
</header>

<main class="contacto-main">
    <div class="contacto-container">
        <h2 class="contacto-titulo">Contáctanos</h2>
        <p class="contacto-subtitulo">¿Tienes alguna duda o sugerencia? ¡Escríbenos!</p>
        
        <form id="contactoForm" novalidate>
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" maxlength="100" placeholder="Tu nombre completo" required>
                <small id="nombreError" class="error-msg"></small>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" maxlength="100" placeholder="ejemplo@duoc.cl" required>
                <small id="emailError" class="error-msg"></small>
            </div>

            <div class="form-group">
                <label for="comentario">Comentario:</label>
                <textarea id="comentario" name="comentario" maxlength="500"  rows="5"  placeholder="Escribe tu mensaje aquí..." required></textarea>
                <small id="comentarioError" class="error-msg"></small>
            </div>

            <button type="submit" id="submitBtn" class="btn-login" disabled>Enviar Mensaje</button>
        </form>
    </div>
</main>

<footer class="footer">
    <div class="footer-contenido">
        <p class="footer-text">&copy; Sitio web de Agatha y Diego. Todos los derechos reservados 2026</p>
        <nav class="footer-btn">
            <a href="contacto.html">Contacto</a>
            <a href="../nosotros/nosotros.html">Nosotros</a>
        </nav>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="contacto.js"></script>

</body>
</html>
