<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogs - PokéComelones</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../inicio/style.css"> 
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <div class="logo">
        <img src="../imagenes/Poké Comelones (1) (1).png" alt="Logo PokéComelones">
    </div>
    <div class="header-spacer"></div>
    <nav class="nav">
        <a href="../inicio/PokeComelones.html" class="btn">Inicio</a>
        <a href="../blogs/blogs.html" class="btn active">Blogs</a>
        <a href="../contacto/contacto.html" class="btn">Contacto</a>
        <a href="../nosotros/nosotros.html" class="btn">Nosotros</a>
        <a href="../carrito/carrito.html" class="btn">🛒 Carrito</a>
    </nav>
</header>

<main class="blogs-main">
    <div class="blogs-container">
        <h2 class="blogs-titulo">Nuestro Blog</h2>
        <p class="blogs-subtitulo">Noticias, recetas y consejos de repostería</p>

        <section id="lista-blogs">
        </section>
    </div>
</main>

<footer class="footer">
    <div class="footer-contenido">
        <p class="footer-text">&copy; Sitio web de Agatha y Diego. Todos los derechos reservados 2026</p>
        <nav class="footer-btn">
            <a href="../contacto/contacto.html">Contacto</a>
            <a href="../nosotros/nosotros.html">Nosotros</a>
            <a href="../blogs/blogs.html">Blogs</a>
        </nav>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="blogs.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const usuarioLogueado = JSON.parse(localStorage.getItem('usuarioLogueado'));
        const nav = document.querySelector('.nav');
        const btnLogin = document.querySelector('a[href="../iniciar_sesion/iniciarSesion.html"]');
        const btnRegistro = document.querySelector('a[href="../registro/registro.html"]');
        const btnAdmin = document.querySelector('a[href="../admin/admin.html"]');

        if (usuarioLogueado) {
            if (btnLogin) btnLogin.style.display = 'none';
            if (btnRegistro) btnRegistro.style.display = 'none';
            if (usuarioLogueado.rol === 'administrador') {
                if (btnAdmin) btnAdmin.style.display = 'inline-flex';
            } else {
                if (btnAdmin) btnAdmin.style.display = 'none';
            }
        } else {
            if (btnLogin) btnLogin.style.display = 'inline-flex';
            if (btnRegistro) btnRegistro.style.display = 'inline-flex';
            if (btnAdmin) btnAdmin.style.display = 'none';
        }
    });
</script>
</body>
</html>
