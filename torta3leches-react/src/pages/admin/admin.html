<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Panel de Control</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="admin-wrapper">
        <aside class="admin-sidebar">
            <div class="sidebar-brand">
                <img src="../imagenes/Poké Comelones (1) (1).png" alt="Logo" style="height: 50px;">
                <h3>Panel Admin</h3>
            </div>
            <nav class="sidebar-nav">
                <a href="admin.html" class="active"><span class="icon">📊</span> Inicio</a>
                <a href="../admin-productos/admin-productos.html"><span class="icon">🍰</span> Productos</a>
                <a href="../admin-usuarios/admin-usuarios.html" id="linkUsuarios">
                <span class="icon">👥</span> Usuarios</a>
                <a href="#" id="btnLogout"><span class="icon">🚪</span> Cerrar Sesión</a>
            </nav>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <h1>Bienvenido, <span id="adminNombre">Administrador</span></h1>
                <div class="admin-user">
                    <span id="adminCorreo">admin@duoc.cl</span>
                </div>
            </header>

            <section class="admin-dashboard">
                <div class="dashboard-cards">
                    <div class="card-stat">
                        <h3>📦 Productos</h3>
                        <p id="totalProductos">0</p>
                    </div>
                    <div class="card-stat">
                        <h3>👤 Usuarios</h3>
                        <p id="totalUsuarios">0</p>
                    </div>
                    <div class="card-stat">
                        <h3>🛒 Pedidos</h3>
                        <p id="totalPedidos">0</p>
                    </div>
                </div>
                <div class="dashboard-welcome">
                    <h2>Panel de Control</h2>
                    <p>Desde aquí puedes gestionar los productos y usuarios de la pastelería.</p>
                    <p>Usa el menú lateral para navegar.</p>
                </div>
            </section>
        </main>
    </div>
    <script src="admin.js"></script>
</body>
</html>
