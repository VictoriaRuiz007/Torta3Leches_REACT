<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Productos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin-productos.css">
</head>
<body>
    <div class="admin-wrapper">
        <aside class="admin-sidebar">
            <div class="sidebar-brand">
                <img src="../imagenes/Poké Comelones (1) (1).png" alt="Logo" style="height: 50px;">
                <h3>Panel Admin</h3>
            </div>
            <nav class="sidebar-nav">
                <a href="../admin/admin.html"><span class="icon">📊</span> Inicio</a>
                <a href="../admin-productos/admin-productos.html" class="active"><span class="icon">🍰</span> Productos</a>
                <a href="../admin-usuarios/admin-usuarios.html"><span class="icon">👥</span> Usuarios</a>
                <a href="#" id="btnLogout"><span class="icon">🚪</span> Cerrar Sesión</a>
            </nav>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <h1>Gestión de Productos</h1>
                <button class="btn-submit" id="btnNuevoProducto" style="width: auto; padding: 8px 25px;">+ Nuevo Producto</button>
            </header>

            <div class="admin-table-container">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Nombre</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Categoría</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaProductos">
                    </tbody>
                </table>
            </div>

            <div id="formProductoContainer" style="display: none;">
                <h3 id="formProductoTitulo">Nuevo Producto</h3>
                <form id="formProducto" class="admin-form" novalidate>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="codigo">Código:</label>
                            <input type="text" id="codigo" required minlength="3">
                            <small id="codigoError" class="error-msg"></small>
                        </div>
                        <div class="form-group">
                            <label for="nombreProducto">Nombre:</label>
                            <input type="text" id="nombreProducto" maxlength="100" required>
                            <small id="nombreProductoError" class="error-msg"></small>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="descripcion">Descripción:</label>
                        <textarea id="descripcion" maxlength="500"></textarea>
                        <small id="descripcionError" class="error-msg"></small>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="precio">Precio (CLP):</label>
                            <input type="number" id="precio" step="0.01" min="0" required>
                            <small id="precioError" class="error-msg"></small>
                        </div>
                        <div class="form-group">
                            <label for="stock">Stock:</label>
                            <input type="number" id="stock" min="0" step="1" required>
                            <small id="stockError" class="error-msg"></small>
                        </div>
                        <div class="form-group">
                            <label for="stockCritico">Stock Crítico:</label>
                            <input type="number" id="stockCritico" min="0" step="1">
                            <small id="stockCriticoError" class="error-msg"></small>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="categoria">Categoría:</label>
                            <select id="categoria" required>
                                <option value="">Seleccionar</option>
                                <option value="Tortas Cuadradas">Tortas Cuadradas</option>
                                <option value="Tortas Circulares">Tortas Circulares</option>
                                <option value="Postres Individuales">Postres Individuales</option>
                                <option value="Productos Sin Azúcar">Productos Sin Azúcar</option>
                                <option value="Pastelería Tradicional">Pastelería Tradicional</option>
                                <option value="Productos Sin Gluten">Productos Sin Gluten</option>
                                <option value="Productos Vegana">Productos Vegana</option>
                                <option value="Tortas Especiales">Tortas Especiales</option>
                            </select>
                            <small id="categoriaError" class="error-msg"></small>
                        </div>
                        <div class="form-group">
                            <label for="imagen">URL Imagen:</label>
                            <input type="text" id="imagen" placeholder="https://ejemplo.com/imagen.jpg">
                            <small id="imagenError" class="error-msg"></small>
                        </div>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button type="submit" id="submitProductoBtn" class="btn-submit" disabled>Guardar</button>
                        <button type="button" id="cancelarProductoBtn" class="btn-submit" style="background-color: #B0BEC5;">Cancelar</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="../admin/admin.js"></script>
    <script src="admin-productos.js"></script>
</body>
</html>
