<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../carrito/style.css">
    <title>Carrito - PokéComelones</title>
</head>
<body>

<header class="header">
    <div class="logo">
        <img src="../imagenes/Poké Comelones (1) (1).png" alt="Logo PokéComelones">
    </div>
    <div class="header-spacer"></div>
    <nav class="nav">
        <a href="../inicio/PokeComelones.html" class="btn">Inicio</a>
        <a href="../iniciar_sesion/iniciarSesion.html" class="btn">Iniciar Sesión</a>
        <a href="../registro/registro.html" class="btn">Registro</a>
    </nav>
</header>

<main style="flex-direction: column; align-items: center;">
    <h2 style="font-family: 'Pacifico', cursive; color: #8B4513; font-size: 36px; margin-bottom: 30px;">Tu Carrito de Compras 🛒</h2>
    
    <div style="width: 100%; max-width: 800px; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(139, 69, 19, 0.15);">
        <table class="table table-hover" id="tabla-carrito">
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Precio</th>
                    <th>Cantidad</th>
                    <th>Subtotal</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="cuerpo-tabla">
            </tbody>
        </table>
        
        <div style="text-align: right; margin-top: 20px; padding-top: 20px; border-top: 2px solid #FFC0CB;">
            <h3 style="color: #8B4513;">Total: <span id="total-carrito">$0</span></h3>
            <button class="btn-login" style="width: auto; padding: 10px 30px; margin-top: 10px;" onclick="vaciarCarrito()">🗑️ Vaciar Carrito</button>
            <button class="btn-login" style="width: auto; padding: 10px 30px; margin-top: 10px; background-color: #4CAF50; border-color: #4CAF50;" onclick="finalizarCompra()">💳 Finalizar Compra</button>
        </div>
    </div>
</main>

<footer class="footer">
    <div class="footer-contenido">
        <p class="footer-text">&copy; Sitio web de Agatha y Diego. Todos los derechos reservados 2026</p>
        <nav class="footer-btn">
            <a href="../contacto/contacto.html">Contacto</a>
            <a href="../nosotros/nosotros.html">Nosotros</a>
        </nav>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../productos.js"></script> 
<script src="carrito.js"></script>

</body>
</html>
